[package]
name = "minecraft-game-desktop"
version = "0.1.0"
description = "Minecraft Modpack Translator"
authors = ["TransHub"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["fs-all", "shell-open", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
directories = "5.0"
uuid = { version = "1.8", features = ["v4"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
minecraft-adapters = { path = "../../../adapters" }
