# SonarQube 项目配置

# 基本信息
sonar.projectKey=th-suite-mc-l10n-frontend
sonar.projectName=TH-Suite MC L10n Frontend
sonar.projectVersion=1.0.0
sonar.organization=th-suite

# 源代码路径
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.*,**/*.spec.*,tests/**/*

# 排除文件
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/archived/**,\
  **/*.d.ts,\
  **/*.config.*,\
  **/test-results/**,\
  **/playwright-report/**

# 测试排除
sonar.test.exclusions=\
  **/src/test/**

# 语言配置
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 覆盖率报告
sonar.coverage.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/test/**,\
  **/tests/**,\
  **/*.config.*,\
  **/setup.*

# 质量门禁
sonar.qualitygate.wait=true

# 重复代码检测
sonar.cpd.exclusions=\
  **/*.test.*,\
  **/*.spec.*

# ESLint 报告
sonar.eslint.reportPaths=test-results/eslint-report.json

# 测试执行报告
sonar.testExecutionReportPaths=test-results/sonar-report.xml

# 代码分析参数
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# TypeScript 配置
sonar.typescript.tsconfigPath=tsconfig.json

# 安全热点和漏洞
sonar.security.hotspots.inheritFromParent=true

# 代码异味和技术债务
sonar.technicalDebt.hoursInDay=8
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5