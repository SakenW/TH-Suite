name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "optimization-refactor-*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  POETRY_VERSION: '1.7.1'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  python-lint-and-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Load cached Poetry dependencies
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
        
      - name: Install project
        run: poetry install --no-interaction
        
      - name: Run Python linting (ruff)
        run: poetry run ruff check . --output-format=github
        
      - name: Run Python formatting check (ruff)
        run: poetry run ruff format --check .
        
      - name: Run type checking (mypy)
        run: poetry run mypy packages apps --ignore-missing-imports
        continue-on-error: true  # 暂时允许类型检查失败
        
      - name: Run Python tests
        run: poetry run pytest --cov=packages --cov-report=xml --cov-report=term-missing
        continue-on-error: true  # 暂时允许测试失败
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

  frontend-lint-and-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20']
        app: ['mc_l10n']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install frontend dependencies
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm install --frozen-lockfile
          
      - name: Run frontend linting (ESLint)
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm lint
        continue-on-error: true  # 暂时允许lint失败
        
      - name: Run frontend type checking
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm type-check
        continue-on-error: true  # 暂时允许类型检查失败
        
      - name: Run frontend formatting check
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm format:check
          
      - name: Run frontend unit tests
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm test:coverage
        continue-on-error: true
        
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: apps/${{ matrix.app }}/frontend/coverage/lcov.info
          flags: frontend-${{ matrix.app }}
          name: frontend-${{ matrix.app }}-coverage
          
      - name: Install Playwright
        run: |
          cd apps/${{ matrix.app }}/frontend
          npx playwright install --with-deps
          
      - name: Run E2E tests
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm test:e2e --reporter=github
        continue-on-error: true
        env:
          CI: true
          
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/frontend/test-results/
          retention-days: 7
          
      - name: Build frontend
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm build

  rust-lint-and-test:
    name: Rust Lint & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        app: ['mc_l10n']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/frontend/src-tauri
          
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk+3
          
      - name: Rust format check
        working-directory: apps/${{ matrix.app }}/frontend/src-tauri
        run: cargo fmt --all -- --check
        
      - name: Clippy check
        working-directory: apps/${{ matrix.app }}/frontend/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run unit tests
        working-directory: apps/${{ matrix.app }}/frontend/src-tauri
        run: cargo test --verbose
        
      - name: Run benchmark tests
        working-directory: apps/${{ matrix.app }}/frontend/src-tauri
        run: cargo bench --verbose
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        
      - name: Install Tarpaulin
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-tarpaulin
        
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/${{ matrix.app }}/frontend/src-tauri
        run: cargo tarpaulin --out Xml --output-dir target/coverage
        
      - name: Upload Rust coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: apps/${{ matrix.app }}/frontend/src-tauri/target/coverage/cobertura.xml
          flags: rust-${{ matrix.app }}
          name: rust-${{ matrix.app }}-coverage

  tauri-build-test:
    name: Tauri Build Test
    runs-on: ${{ matrix.os }}
    needs: [frontend-lint-and-test, rust-lint-and-test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        app: ['mc_l10n']
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk+3
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Install frontend dependencies
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm install --frozen-lockfile
          
      - name: Build Tauri app
        run: |
          cd apps/${{ matrix.app }}/frontend
          pnpm tauri:build
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}-${{ matrix.os }}
          path: |
            apps/${{ matrix.app }}/frontend/src-tauri/target/release/bundle/
          retention-days: 7

  dependency-security-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          
      - name: Install dependencies
        run: poetry install --no-interaction
        
      - name: Run Python security audit
        run: poetry run pip-audit --format=json --output=python-audit.json
        continue-on-error: true
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Run npm security audit
        run: |
          cd apps/mc_l10n/frontend
          pnpm audit --audit-level high
        continue-on-error: true
        
      - name: Setup Rust for security audit
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run Rust security audit
        run: |
          cd apps/mc_l10n/frontend/src-tauri
          cargo audit
        continue-on-error: true
        
      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: python-audit.json
        continue-on-error: true

  code-quality-check:
    name: Code Quality & Architecture Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          
      - name: Install dependencies
        run: poetry install --no-interaction
        
      - name: Check architecture boundaries (Python)
        run: |
          echo "检查架构边界和依赖关系..."
          # 使用import-linter检查Python架构约束
          pip install import-linter
          echo "Python架构检查暂时跳过，需要配置import-linter规则"
        continue-on-error: true
        
      - name: Check code complexity
        run: |
          echo "检查代码复杂度..."
          poetry run ruff check . --select=C90 --show-source
        continue-on-error: true
        
      - name: Check for TODO/FIXME comments
        run: |
          echo "检查待办事项和修复标记..."
          grep -r "TODO\|FIXME\|HACK\|XXX" --include="*.py" --include="*.ts" --include="*.tsx" . || true

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [python-lint-and-test, frontend-lint-and-test, rust-lint-and-test, tauri-build-test, dependency-security-check, code-quality-check]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "Python Lint & Test: ${{ needs.python-lint-and-test.result }}"
          echo "Frontend Lint & Test: ${{ needs.frontend-lint-and-test.result }}"
          echo "Rust Lint & Test: ${{ needs.rust-lint-and-test.result }}"
          echo "Tauri Build Test: ${{ needs.tauri-build-test.result }}"
          echo "Security Check: ${{ needs.dependency-security-check.result }}"
          echo "Quality Check: ${{ needs.code-quality-check.result }}"
          
          # 如果核心检查失败，标记为失败
          if [[ "${{ needs.python-lint-and-test.result }}" == "failure" ]]; then
            echo "Python检查失败，CI失败"
            exit 1
          fi
          
          if [[ "${{ needs.frontend-lint-and-test.result }}" == "failure" ]]; then
            echo "前端检查失败，CI失败"
            exit 1
          fi
          
          if [[ "${{ needs.rust-lint-and-test.result }}" == "failure" ]]; then
            echo "Rust检查失败，CI失败"
            exit 1
          fi
          
          if [[ "${{ needs.tauri-build-test.result }}" == "failure" ]]; then
            echo "Tauri构建失败，CI失败"
            exit 1
          fi
          
          echo "所有CI检查通过！🎉"