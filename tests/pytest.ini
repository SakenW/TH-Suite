[tool:pytest]
# pytest 配置文件

# 测试发现配置
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# 最小版本要求
minversion = 7.0

# 添加选项
addopts = 
    # 详细输出
    -v
    # 显示测试覆盖率
    --cov=apps
    --cov=packages
    # 覆盖率报告格式
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # 严格的标记检查
    --strict-markers
    # 显示最慢的10个测试
    --durations=10
    # 并发运行测试（如果安装了 pytest-xdist）
    # -n auto
    # 失败时停止
    # --maxfail=1
    # 显示额外的测试摘要信息
    -ra

# 测试标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    performance: 性能测试
    slow: 慢速测试
    api: API测试
    database: 数据库测试
    filesystem: 文件系统测试
    network: 网络测试
    security: 安全测试

# 过滤警告
filterwarnings =
    # 忽略特定的警告
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # 将特定警告转为错误
    error::UserWarning

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 异步测试配置
asyncio_mode = auto

# 临时目录配置
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# JUnit XML 报告（用于 CI/CD）
junit_family = xunit2

# 测试超时配置（需要 pytest-timeout）
timeout = 300
timeout_method = thread